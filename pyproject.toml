[project]
name = "figure-extraction"
version = "0.1.0"
description = "figbox — figure/table bounding-box extraction for scientific PDFs (DocLayout-YOLO via ONNX Runtime)"
readme = "README.md"
requires-python = ">=3.12"
# Runtime deps only — lean, no torch. The one-time model export (export_model.py)
# needs torch + doclayout-yolo and is run in a throwaway env, NOT installed here:
#   uv run --no-project --python 3.12 \
#     --with doclayout-yolo --with huggingface_hub --with onnx --with onnxslim \
#     python export_model.py
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",  # required for UploadFile / multipart form parsing
    "uvicorn[standard]>=0.30",
    "onnxruntime>=1.20",
    "pymupdf>=1.24",
    "pillow>=11",
    "numpy>=2",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
]

[tool.uv]
# Scripts + a service module, not an installable package — uv manages the
# dependency env but doesn't try to build/install the project itself.
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Defaults (pyflakes F + pycodestyle errors E4/E7/E9) plus import sorting (I),
# pyupgrade (UP, modernize syntax for target-version), and bugbear (B,
# likely-bug patterns).
extend-select = ["I", "UP", "B"]
